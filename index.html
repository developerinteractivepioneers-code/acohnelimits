<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Driving Statistics Teaser</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="stage">
      <section class="teaser" data-teaser data-value="2168">
        <div class="teaser__visual">
          <img
            class="teaser__map"
            src="/assets/map-placeholder.png"
            width="138"
            height="139"
            alt=""
            decoding="async"
          />
          <div class="teaser__divider" aria-hidden="true"></div>
          <div class="teaser__stats" data-stats>
            <div class="bars" aria-hidden="true">
              <span class="bar" style="--x: 6%; --b: 132px; --h: 28px; --dur: 3.4s; --delay: 0s; --travel: 56px"></span>
              <span class="bar" style="--x: 15%; --b: 156px; --h: 40px; --dur: 4.2s; --delay: -1.3s; --travel: 72px"></span>
              <span class="bar" style="--x: 24%; --b: 118px; --h: 24px; --dur: 3.1s; --delay: -2.4s; --travel: 50px"></span>
              <span class="bar" style="--x: 34%; --b: 166px; --h: 36px; --dur: 3.8s; --delay: -0.6s; --travel: 66px"></span>
              <span class="bar" style="--x: 43%; --b: 140px; --h: 32px; --dur: 3.3s; --delay: -2.0s; --travel: 58px"></span>
              <span class="bar" style="--x: 52%; --b: 174px; --h: 44px; --dur: 4.4s; --delay: -3.0s; --travel: 80px"></span>
              <span class="bar" style="--x: 61%; --b: 124px; --h: 22px; --dur: 3.0s; --delay: -1.6s; --travel: 48px"></span>
              <span class="bar" style="--x: 70%; --b: 160px; --h: 38px; --dur: 4.0s; --delay: -0.4s; --travel: 70px"></span>
              <span class="bar" style="--x: 79%; --b: 136px; --h: 30px; --dur: 3.6s; --delay: -2.6s; --travel: 60px"></span>
              <span class="bar" style="--x: 88%; --b: 150px; --h: 26px; --dur: 3.2s; --delay: -1.0s; --travel: 54px"></span>
            </div>
            <div class="odometer" data-odometer aria-hidden="true"></div>
            <p class="visually-hidden" data-announce aria-live="polite"></p>
          </div>
        </div>
        <p class="teaser__claim" data-claim>Ready to drive to your numbers?</p>
        <script type="application/json" data-metrics>
          [
            { "claim": "Ready to explore your kilometres?", "unit": "km", "min": 100, "max": 50000 },
            { "claim": "Ready to explore your routes?", "unit": "", "min": 1, "max": 150 },
            { "claim": "Ready to explore your curves?", "unit": "", "min": 50, "max": 20000 },
            { "claim": "Ready to explore your driving time?", "unit": "h", "min": 1, "max": 800 },
            { "claim": "Ready to explore your lateral G?", "unit": "g", "min": 0.3, "max": 1.2, "decimals": 1 },
            { "claim": "Ready to explore your elevation gain?", "unit": "m", "min": 100, "max": 60000 }
          ]
        </script>
        <button class="teaser__cta" type="button" data-generate>Generate Driving Statistics</button>
      </section>
      <button class="stage__reset" type="button" data-reset>Reset demo</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
