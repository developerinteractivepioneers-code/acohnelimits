<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Driving Statistics Teaser</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="stage">
      <section class="teaser" data-teaser data-value="2168">
        <div class="teaser__visual">
          <div class="teaser__figure">
            <img
              class="teaser__map"
              src="/assets/map.png"
              width="243"
              height="196"
              alt=""
              decoding="async"
            />
          </div>
          <div class="teaser__divider" aria-hidden="true"></div>
          <div class="teaser__stats" data-stats>
            <!--
              Streak geometry from the design: x as a share of the number width,
              bottom offset from the number's baseline box, length and peak opacity.
              The two tall streaks fade out over short numbers.
            -->
            <div class="bars" data-bars aria-hidden="true">
              <span class="bar" style="--x: 8%; --b: 2px; --h: 61px; --alpha: 0.5; --dur: 3.4s; --delay: 0s; --travel: 48px"></span>
              <span class="bar" style="--x: 70%; --b: -27px; --h: 42px; --alpha: 1; --dur: 3.1s; --delay: -0.6s; --travel: 40px"></span>
              <span class="bar" style="--x: 76%; --b: -10px; --h: 82px; --alpha: 0.25; --dur: 4.4s; --delay: -3.0s; --travel: 60px"></span>
              <span class="bar" style="--x: 95%; --b: 36px; --h: 66px; --alpha: 1; --dur: 3.6s; --delay: -1.8s; --travel: 54px"></span>
              <span class="bar" style="--x: 104%; --b: -14px; --h: 48px; --alpha: 1; --dur: 3.3s; --delay: -0.9s; --travel: 44px"></span>
              <span class="bars__tall">
                <span class="bar" style="--x: 40%; --b: -32px; --h: 95px; --alpha: 1; --dur: 4.2s; --delay: -1.3s; --travel: 70px"></span>
                <span class="bar" style="--x: 61%; --b: 36px; --h: 92px; --alpha: 1; --dur: 3.8s; --delay: -2.4s; --travel: 66px"></span>
              </span>
            </div>
            <div class="odometer" data-odometer aria-hidden="true"></div>
            <p class="visually-hidden" data-announce aria-live="polite"></p>
          </div>
        </div>
        <p class="teaser__claim" data-claim>Ready to explore your <strong>kilometres</strong>?</p>
        <script type="application/json" data-metrics>
          [
            { "claim": "Ready to explore your {entity}?", "entity": "kilometres", "unit": "km", "min": 100, "max": 50000 },
            { "claim": "Ready to explore your {entity}?", "entity": "routes", "unit": "", "min": 1, "max": 150 },
            { "claim": "Ready to explore your {entity}?", "entity": "curves", "unit": "Stk", "min": 50, "max": 20000 },
            { "claim": "Ready to explore your {entity}?", "entity": "driving time", "unit": "h", "min": 1, "max": 800 },
            { "claim": "Ready to explore your {entity}?", "entity": "lateral G", "unit": "g", "min": 0.3, "max": 1.2, "decimals": 1 },
            { "claim": "Ready to explore your {entity}?", "entity": "elevation gain", "unit": "m", "min": 100, "max": 60000 }
          ]
        </script>
        <button class="teaser__cta" type="button" data-generate>Generate Driving Statistics</button>
      </section>
      <button class="stage__reset" type="button" data-reset>Reset demo</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
