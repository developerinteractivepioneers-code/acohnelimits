<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Driving Statistics Teaser</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="stage">
      <section class="teaser" data-teaser data-value="2168" data-unit="km">
        <div class="teaser__visual">
          <img
            class="teaser__map"
            src="/assets/map-placeholder.png"
            width="138"
            height="139"
            alt=""
            decoding="async"
          />
          <div class="teaser__divider" aria-hidden="true"></div>
          <div class="teaser__stats">
            <div class="bars" aria-hidden="true">
              <span class="bar" style="--x: 67px; --b: 102px; --h: 45px; --dur: 2.9s; --delay: 0s"></span>
              <span class="bar" style="--x: 78px; --b: 128px; --h: 43px; --dur: 3.4s; --delay: -1.1s"></span>
              <span class="bar" style="--x: 83px; --b: 79px; --h: 19px; --dur: 2.3s; --delay: -0.4s"></span>
              <span class="bar" style="--x: 97px; --b: 155px; --h: 30px; --dur: 3.1s; --delay: -2.2s"></span>
              <span class="bar" style="--x: 101px; --b: 82px; --h: 35px; --dur: 2.6s; --delay: -1.7s"></span>
            </div>
            <div class="odometer" data-odometer aria-hidden="true"></div>
            <p class="visually-hidden" data-announce aria-live="polite"></p>
          </div>
        </div>
        <p class="teaser__claim">Ready to drive to your numbers?</p>
        <button class="teaser__cta" type="button" data-generate>Generate Driving Statistics</button>
      </section>
      <button class="stage__reset" type="button" data-reset>Reset demo</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
