<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Driving Statistics Teaser</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main class="stage">
      <section class="teaser" data-teaser data-value="2168" data-unit="km">
        <div class="teaser__visual">
          <img
            class="teaser__map"
            src="/assets/map-placeholder.png"
            width="138"
            height="139"
            alt=""
            decoding="async"
          />
          <div class="teaser__divider" aria-hidden="true"></div>
          <div class="teaser__stats">
            <div class="bars" aria-hidden="true">
              <span class="bar" style="--x: 14px; --b: 118px; --h: 32px; --dur: 1.7s; --delay: 0s"></span>
              <span class="bar" style="--x: 30px; --b: 92px; --h: 48px; --dur: 2.1s; --delay: -0.6s"></span>
              <span class="bar" style="--x: 46px; --b: 136px; --h: 26px; --dur: 1.5s; --delay: -1.2s"></span>
              <span class="bar" style="--x: 61px; --b: 76px; --h: 40px; --dur: 1.9s; --delay: -0.3s"></span>
              <span class="bar" style="--x: 75px; --b: 150px; --h: 36px; --dur: 1.6s; --delay: -1.0s"></span>
              <span class="bar" style="--x: 88px; --b: 104px; --h: 52px; --dur: 2.2s; --delay: -1.5s"></span>
              <span class="bar" style="--x: 102px; --b: 82px; --h: 22px; --dur: 1.4s; --delay: -0.8s"></span>
              <span class="bar" style="--x: 116px; --b: 128px; --h: 44px; --dur: 2.0s; --delay: -0.2s"></span>
              <span class="bar" style="--x: 131px; --b: 96px; --h: 30px; --dur: 1.8s; --delay: -1.3s"></span>
              <span class="bar" style="--x: 147px; --b: 142px; --h: 38px; --dur: 1.6s; --delay: -0.5s"></span>
              <span class="bar" style="--x: 162px; --b: 110px; --h: 24px; --dur: 1.5s; --delay: -1.1s"></span>
            </div>
            <div class="odometer" data-odometer aria-hidden="true"></div>
            <p class="visually-hidden" data-announce aria-live="polite"></p>
          </div>
        </div>
        <p class="teaser__claim">Ready to drive to your numbers?</p>
        <button class="teaser__cta" type="button" data-generate>Generate Driving Statistics</button>
      </section>
      <button class="stage__reset" type="button" data-reset>Reset demo</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
